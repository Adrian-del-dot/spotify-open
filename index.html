<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening Spotify…</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#EFEAE1;color:#5F5A52;
    font:14px/1.5 -apple-system,"Helvetica Neue",system-ui,sans-serif;text-align:center;padding:0 24px}
  a{color:#1D1B18;text-underline-offset:3px}
</style>
<p id="msg">Opening Spotify…</p>
<script>
  // Album Shelf hands albums to the Spotify app from here, because its own sandboxed frame can't.
  const id = (new URLSearchParams(location.search).get("album") || "").replace(/[^A-Za-z0-9]/g, "");
  const msg = document.getElementById("msg");
  if (!id) {
    msg.textContent = "No album given.";
  } else {
    const web = "https://open.spotify.com/album/" + id;
    addEventListener("blur", () => setTimeout(() => window.close(), 400)); // the app took focus
    location.href = "spotify:album:" + id;
    setTimeout(() => {
      msg.innerHTML = 'Spotify opened? You can close this tab.<br>If not, <a href="' + web + '">open the web player</a>.';
    }, 1500);
  }
</script>
</html>
